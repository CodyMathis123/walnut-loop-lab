name: Planner regression tests

on:
  push:
    branches: [Production, feature/threejs-depth-buffer]
  pull_request:

jobs:
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing editor and Canvas/SVG checks
        run: node tests/smoke-check.mjs
      - name: GPU scene and depth-buffer bridge checks
        run: node tests/webgl-smoke-check.mjs
      - name: Sheet-metal tray and 60 mm radiator geometry
        run: node tests/component-geometry-check.mjs
      - name: Dual/single cooling layouts and reservoir rotation
        run: node tests/cooling-layout-check.mjs
      - name: Gigabyte Mini-ITX, tray support clearance, and front-facing radiator ports
        run: node tests/itx-layout-check.mjs
