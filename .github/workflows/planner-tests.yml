name: Planner regression tests

on:
  push:
    branches: [Production, feature/threejs-depth-buffer]
  pull_request:

jobs:
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing editor and Canvas/SVG checks
        run: node tests/smoke-check.mjs
      - name: GPU scene and depth-buffer bridge checks
        run: node tests/webgl-smoke-check.mjs
      - name: Sheet-metal tray and 60 mm radiator geometry
        run: node tests/component-geometry-check.mjs
      - name: Dual/single cooling layouts and reservoir rotation
        run: node tests/cooling-layout-check.mjs
      - name: Gigabyte Mini-ITX, tray support clearance, and front-facing radiator ports
        run: node tests/itx-layout-check.mjs
      - name: Left/right shared loop and interactive tubing waypoint editor
        run: node tests/tubing-editor-check.mjs
      - name: 3D tube clearance, physical compression fittings and swivel orientation
        run: node tests/route-collision-check.mjs
      - name: Horizontal Alphacool GPU assembly on motherboard tray
        run: node tests/gpu-layout-check.mjs
      - name: Fan volumes and tubing collision avoidance
        run: node tests/fan-clearance-check.mjs
      - name: Tube-to-tube separation and global 45 degree fitting permission
        run: node tests/tube-separation-check.mjs
      - name: Port exit tangents and walnut case shell clearance
        run: node tests/physical-port-clearance-check.mjs
      - name: Per-corner elbow hardware and hard-tube bend angle validation
        run: node tests/corner-angle-check.mjs
